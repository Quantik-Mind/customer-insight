name: Offline demo validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QUANTIKMIND_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install pytest==9.0.3 PyYAML==6.0.3
      - run: python -m pytest tests -q
      - name: Install checksum-verified actionlint
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt -o /tmp/checksums.txt
          grep ' actionlint_1.7.12_linux_amd64.tar.gz$' /tmp/checksums.txt | sed 's/actionlint_1.7.12_linux_amd64.tar.gz/actionlint.tar.gz/' > /tmp/verify.txt
          (cd /tmp && sha256sum --check verify.txt)
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Validate workflows including explicit queue contract
        run: |
          python - <<'PY'
          import yaml
          with open('.github/workflows/selection-demo.yml') as f:
              value=yaml.safe_load(f)
          assert value['concurrency']['queue']=='max'
          assert value['concurrency']['cancel-in-progress'] is False
          PY
          /tmp/actionlint -shellcheck= -pyflakes= -ignore '^unexpected key "queue" for "concurrency" section\.' .github/workflows/selection-demo.yml .github/workflows/validate-demo.yml .github/workflows/customer-insight.yml
